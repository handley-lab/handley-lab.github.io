# Weekly update of the paper map on /papers/. Looks for new group papers from
# the last 10 days (a little over a week, so a late or failed run misses nothing)
# with script/papers.py and refreshes citation counts. If anything changed, it
# opens a pull request for a human to review; nothing is published until that PR
# is merged, and nothing is removed.
#
# Needs Settings > Actions > General > "Allow GitHub Actions to create and
# approve pull requests" to be enabled.
name: Refresh paper map

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - run: pip install requests pyyaml

      - run: python script/papers.py --days 10 --summary "$RUNNER_TEMP/papers-summary.md"

      - id: summary
        run: |
          {
            echo "body<<EOF"
            cat "$RUNNER_TEMP/papers-summary.md"
            echo
            echo "Generated by the weekly paper-map workflow (.github/workflows/papers.yml)."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: peter-evans/create-pull-request@v7.0.5
        with:
          branch: automation/paper-map
          delete-branch: true
          commit-message: Refresh paper map
          title: Refresh paper map
          body: ${{ steps.summary.outputs.body }}
          add-paths: assets/papers/papers.json
