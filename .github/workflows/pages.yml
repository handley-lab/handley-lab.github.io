# Builds the site with the repository's own Gemfile.lock and publishes it to
# GitHub Pages on every push to main, so production uses the same Jekyll, Sass
# and minima versions as local builds. A failed build or script/check leaves
# the live site as it was.
#
# Needs Settings > Pages > Build and deployment > Source set to "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces a queued deployment, but never interrupts a running one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: ruby/setup-ruby@v1.245.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Build
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Check
        run: ruby script/check

      - uses: actions/upload-pages-artifact@v3.0.1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job can publish; the build job runs third-party gems
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4.0.5
